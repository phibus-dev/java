name: Maven CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/maven-s3-uploader
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: mvn -B clean verify

      - name: Verify executable JAR
        run: test -f target/s3-multipart-uploader-1.0.0-SNAPSHOT.jar
