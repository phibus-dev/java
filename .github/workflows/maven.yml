name: Maven CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build, test and analyze
        run: mvn -B clean verify

      - name: Verify executable JAR
        run: test -f target/s3-multipart-uploader-1.0.0-SNAPSHOT.jar

      - name: Upload executable JAR
        uses: actions/upload-artifact@v4
        with:
          name: s3-multipart-uploader
          path: target/s3-multipart-uploader-1.0.0-SNAPSHOT.jar
          if-no-files-found: error
          retention-days: 14

      - name: Upload JaCoCo report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco
          if-no-files-found: error
          retention-days: 14
