name: Maven CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
    branches:
      - main
      - 'release/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Resolve project version
        id: project
        shell: bash
        run: echo "version=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> "$GITHUB_OUTPUT"

      - name: Build, test and analyze
        shell: bash
        run: |
          for attempt in 1 2 3; do
            mvn -B clean verify && break
            if [[ $attempt -eq 3 ]]; then exit 1; fi
            echo "Maven failed, retrying in $((attempt * 15)) seconds..."
            sleep $((attempt * 15))
          done

      - name: Verify executable JAR and SBOM
        run: |
          test -f "target/s3-multipart-uploader-${{ steps.project.outputs.version }}.jar"
          test -f target/classes/META-INF/sbom/application.cdx.json

      - name: Upload executable JAR
        uses: actions/upload-artifact@v7
        with:
          name: s3-performance-test-web-${{ steps.project.outputs.version }}
          path: target/s3-multipart-uploader-${{ steps.project.outputs.version }}.jar
          if-no-files-found: error
          retention-days: 14

      - name: Upload CycloneDX SBOM
        uses: actions/upload-artifact@v7
        with:
          name: cyclonedx-sbom-${{ steps.project.outputs.version }}
          path: target/classes/META-INF/sbom/application.cdx.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload JaCoCo report
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report-${{ steps.project.outputs.version }}
          path: target/site/jacoco
          if-no-files-found: error
          retention-days: 14
