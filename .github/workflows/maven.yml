name: Maven CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build, test and analyze
        shell: bash
        run: |
          for attempt in 1 2 3; do
            mvn -B clean verify && break
            if [[ $attempt -eq 3 ]]; then exit 1; fi
            echo "Maven failed, retrying in $((attempt * 15)) seconds..."
            sleep $((attempt * 15))
          done

      - name: Verify executable JAR
        run: test -f target/s3-multipart-uploader-1.3.0-SNAPSHOT.jar

      - name: Upload executable JAR
        uses: actions/upload-artifact@v7
        with:
          name: s3-performance-test-web
          path: target/s3-multipart-uploader-1.3.0-SNAPSHOT.jar
          if-no-files-found: error
          retention-days: 14

      - name: Upload JaCoCo report
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: target/site/jacoco
          if-no-files-found: error
          retention-days: 14
