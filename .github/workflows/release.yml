name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag, for example v2.5.0-rc2'
        required: true
        default: 'v2.5.0-rc2'
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  release:
    if: ${{ github.event_name == 'push' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Resolve versions
        id: version
        shell: bash
        run: |
          PROJECT_VERSION=$(python3 - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse("pom.xml").getroot()
          namespace = {"m": "http://maven.apache.org/POM/4.0.0"}
          version = root.findtext("m:version", namespaces=namespace)
          if not version:
              raise SystemExit("Project version is missing from pom.xml")
          print(version)
          PY
          )
          BASE_VERSION="${PROJECT_VERSION%%-*}"
          IFS=. read -r VERSION_MAJOR VERSION_MINOR VERSION_PATCH <<< "$BASE_VERSION"
          [[ -n "$VERSION_MAJOR" && -n "$VERSION_MINOR" && -n "$VERSION_PATCH" ]]
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then RELEASE_TAG="${{ inputs.version }}"; elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then RELEASE_TAG="${GITHUB_REF_NAME}"; else RELEASE_TAG="v${PROJECT_VERSION}"; fi
          test "$RELEASE_TAG" = "v${PROJECT_VERSION}"
          echo "project=$PROJECT_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "minor=${VERSION_MAJOR}.${VERSION_MINOR}" >> "$GITHUB_OUTPUT"
      - name: Build, test and create documentation artifacts
        run: mvn -B clean verify source:jar javadoc:jar
      - name: Test automation CLI
        run: python3 -m unittest discover -s src/test/python -p 'test_*.py'
      - name: Prepare release assets
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.project }}"; RELEASE_NOTES="RELEASE_NOTES_${VERSION}.md"; UPGRADE_GUIDE="UPGRADE_${VERSION}.md"
          mkdir -p dist; test -f "$RELEASE_NOTES"; test -f "$UPGRADE_GUIDE"
          cp "target/s3-multipart-uploader-${VERSION}.jar" "dist/evo-snt-s3-${VERSION}.jar"
          cp "target/s3-multipart-uploader-${VERSION}-sources.jar" "dist/evo-snt-s3-${VERSION}-sources.jar"
          cp "target/s3-multipart-uploader-${VERSION}-javadoc.jar" "dist/evo-snt-s3-${VERSION}-javadoc.jar"
          cp target/classes/META-INF/sbom/application.cdx.json "dist/evo-snt-s3-${VERSION}-sbom.cdx.json"
          cp bin/evo-snt dist/evo-snt
          cp README.md "$RELEASE_NOTES" "$UPGRADE_GUIDE" KAFKA_M3_ACCEPTANCE.md KAFKA_M4_ACCEPTANCE.md dist/
          BUNDLE_NAME="evo-snt-offline-soak-${VERSION}"
          BUNDLE_ROOT="dist/${BUNDLE_NAME}"
          install -D -m 0755 bin/evo-snt "$BUNDLE_ROOT/bin/evo-snt"
          install -D -m 0755 scripts/reference-soak-local.sh "$BUNDLE_ROOT/scripts/reference-soak-local.sh"
          install -D -m 0644 deploy/systemd/evo-snt-reference-soak.service "$BUNDLE_ROOT/deploy/systemd/evo-snt-reference-soak.service"
          install -D -m 0644 deploy/systemd/evo-snt-reference-soak.timer "$BUNDLE_ROOT/deploy/systemd/evo-snt-reference-soak.timer"
          install -D -m 0644 config/soak-reference.example.json "$BUNDLE_ROOT/config/soak-reference.example.json"
          install -D -m 0644 config/reference-soak.env.example "$BUNDLE_ROOT/config/reference-soak.env.example"
          install -D -m 0644 M4_SOAK_TESTS.md "$BUNDLE_ROOT/M4_SOAK_TESTS.md"
          cd dist
          tar --owner=0 --group=0 --numeric-owner -czf "${BUNDLE_NAME}.tar.gz" "$BUNDLE_NAME"
          rm -r "$BUNDLE_NAME"
          sha256sum *.jar *.json *.tar.gz evo-snt README.md "$RELEASE_NOTES" "$UPGRADE_GUIDE" KAFKA_M3_ACCEPTANCE.md KAFKA_M4_ACCEPTANCE.md > SHA256SUMS
      - name: Upload release assets to Actions
        uses: actions/upload-artifact@v7
        with:
          name: evo-snt-s3-${{ steps.version.outputs.project }}-release-assets
          path: dist/*
          if-no-files-found: error
          retention-days: 14
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and publish prerelease Docker image
        if: ${{ contains(steps.version.outputs.project, '-') }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.release
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/s3-performance-test-web:${{ steps.version.outputs.project }}
          build-args: JAR_FILE=dist/evo-snt-s3-${{ steps.version.outputs.project }}.jar
      - name: Build and publish stable Docker image
        if: ${{ !contains(steps.version.outputs.project, '-') }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.release
          push: true
          build-args: JAR_FILE=dist/evo-snt-s3-${{ steps.version.outputs.project }}.jar
          tags: |
            ghcr.io/${{ github.repository_owner }}/s3-performance-test-web:${{ steps.version.outputs.project }}
            ghcr.io/${{ github.repository_owner }}/s3-performance-test-web:${{ steps.version.outputs.minor }}
            ghcr.io/${{ github.repository_owner }}/s3-performance-test-web:latest
      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ЭВО.СНТ S3 ${{ steps.version.outputs.tag }}
          prerelease: ${{ contains(steps.version.outputs.project, '-') }}
          body_path: RELEASE_NOTES_${{ steps.version.outputs.project }}.md
          fail_on_unmatched_files: true
          files: |
            dist/evo-snt-s3-${{ steps.version.outputs.project }}.jar
            dist/evo-snt-s3-${{ steps.version.outputs.project }}-sources.jar
            dist/evo-snt-s3-${{ steps.version.outputs.project }}-javadoc.jar
            dist/evo-snt-s3-${{ steps.version.outputs.project }}-sbom.cdx.json
            dist/evo-snt-offline-soak-${{ steps.version.outputs.project }}.tar.gz
            dist/evo-snt
            dist/SHA256SUMS
            dist/README.md
            dist/RELEASE_NOTES_${{ steps.version.outputs.project }}.md
            dist/UPGRADE_${{ steps.version.outputs.project }}.md
            dist/KAFKA_M3_ACCEPTANCE.md
            dist/KAFKA_M4_ACCEPTANCE.md
