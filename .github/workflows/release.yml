name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag, for example v1.2.0'
        required: true
        default: 'v1.2.0'
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || github.sha == 'f20f05923442095d4359a7992244f95de237c580'
    runs-on: ubuntu-latest

    steps:
      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="v1.2.0"
          fi
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image_version=${VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build, test and create documentation artifacts
        run: mvn -B clean verify source:jar javadoc:jar

      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p dist
          cp target/s3-multipart-uploader-1.2.0.jar \
             "dist/s3-performance-test-web-${{ steps.version.outputs.version }}.jar"
          cp target/s3-multipart-uploader-1.2.0-sources.jar \
             "dist/s3-performance-test-web-${{ steps.version.outputs.version }}-sources.jar"
          cp target/s3-multipart-uploader-1.2.0-javadoc.jar \
             "dist/s3-performance-test-web-${{ steps.version.outputs.version }}-javadoc.jar"
          cp README.md dist/README.md
          cd dist
          sha256sum *.jar README.md > SHA256SUMS

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/s3-performance-test-web:${{ steps.version.outputs.image_version }}
            ghcr.io/${{ github.repository_owner }}/s3-performance-test-web:latest

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: S3 Performance Test Web ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            dist/s3-performance-test-web-${{ steps.version.outputs.version }}.jar
            dist/s3-performance-test-web-${{ steps.version.outputs.version }}-sources.jar
            dist/s3-performance-test-web-${{ steps.version.outputs.version }}-javadoc.jar
            dist/SHA256SUMS
            dist/README.md
