name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag, for example v2.0.1'
        required: true
        default: 'v2.0.1'
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Resolve versions
        id: version
        shell: bash
        run: |
          PROJECT_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            RELEASE_TAG="${{ inputs.version }}"
          else
            RELEASE_TAG="${GITHUB_REF_NAME}"
          fi
          test "$RELEASE_TAG" = "v${PROJECT_VERSION}"
          echo "project=$PROJECT_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Build, test and create documentation artifacts
        run: mvn -B clean verify source:jar javadoc:jar

      - name: Prepare release assets
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.project }}"
          RELEASE_NOTES="RELEASE_NOTES_${VERSION}.md"
          mkdir -p dist
          test -f "$RELEASE_NOTES"
          cp "target/s3-multipart-uploader-${VERSION}.jar" "dist/s3-performance-test-web-${VERSION}.jar"
          cp "target/s3-multipart-uploader-${VERSION}-sources.jar" "dist/s3-performance-test-web-${VERSION}-sources.jar"
          cp "target/s3-multipart-uploader-${VERSION}-javadoc.jar" "dist/s3-performance-test-web-${VERSION}-javadoc.jar"
          cp target/classes/META-INF/sbom/application.cdx.json "dist/s3-performance-test-web-${VERSION}-sbom.cdx.json"
          cp README.md "$RELEASE_NOTES" UPGRADE_2.0.0.md dist/
          cd dist
          sha256sum *.jar *.json README.md "$RELEASE_NOTES" UPGRADE_2.0.0.md > SHA256SUMS

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/s3-performance-test-web:${{ steps.version.outputs.project }}
            ghcr.io/${{ github.repository_owner }}/s3-performance-test-web:latest

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: S3 Performance Test Web ${{ steps.version.outputs.tag }}
          body_path: RELEASE_NOTES_${{ steps.version.outputs.project }}.md
          files: |
            dist/s3-performance-test-web-${{ steps.version.outputs.project }}.jar
            dist/s3-performance-test-web-${{ steps.version.outputs.project }}-sources.jar
            dist/s3-performance-test-web-${{ steps.version.outputs.project }}-javadoc.jar
            dist/s3-performance-test-web-${{ steps.version.outputs.project }}-sbom.cdx.json
            dist/SHA256SUMS
            dist/README.md
            dist/RELEASE_NOTES_${{ steps.version.outputs.project }}.md
            dist/UPGRADE_2.0.0.md
