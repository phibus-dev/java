<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Security Audit</title>
  <style>
    body{font-family:Arial,sans-serif;margin:24px;background:#f5f7fb;color:#172033} h1{margin-bottom:8px}
    .filters,.summary{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0}.card{background:#fff;border:1px solid #dce3ef;border-radius:10px;padding:16px}
    input,select,button{padding:9px;border:1px solid #b9c4d4;border-radius:6px}button{background:#1769d2;color:#fff;cursor:pointer}
    table{width:100%;border-collapse:collapse;background:#fff}th,td{padding:9px;border-bottom:1px solid #e4e9f1;text-align:left;font-size:14px}th{background:#eef3f9}
    .error{color:#b42318}.ok{color:#067647}
  </style>
</head>
<body>
  <h1>Аудит безопасности</h1>
  <div class="summary">
    <div class="card">Всего событий: <strong id="total">0</strong></div>
    <div class="card">Ошибки HTTP: <strong id="errors">0</strong></div>
  </div>
  <div class="filters card">
    <input id="username" placeholder="Пользователь">
    <select id="method"><option value="">Все методы</option><option>GET</option><option>POST</option><option>PUT</option><option>PATCH</option><option>DELETE</option></select>
    <input id="status" type="number" placeholder="HTTP status">
    <input id="from" type="datetime-local">
    <input id="to" type="datetime-local">
    <button onclick="loadAudit()">Применить</button>
  </div>
  <table>
    <thead><tr><th>Время</th><th>Пользователь</th><th>Действие</th><th>Метод</th><th>Путь</th><th>Статус</th><th>IP</th><th>мс</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
<script>
function csrfHeaders(){const m=document.cookie.match(/(?:^|; )XSRF-TOKEN=([^;]*)/);return m?{'X-XSRF-TOKEN':decodeURIComponent(m[1])}:{};}
async function loadSummary(){const r=await fetch('/api/audit/summary',{headers:csrfHeaders()});if(r.ok){const d=await r.json();total.textContent=d.total;errors.textContent=d.errors;}}
async function loadAudit(){const p=new URLSearchParams({limit:'200'});for(const id of ['username','method','status']){const v=document.getElementById(id).value;if(v)p.set(id,v);}for(const id of ['from','to']){const v=document.getElementById(id).value;if(v)p.set(id,new Date(v).toISOString());}
 const r=await fetch('/api/audit?'+p,{headers:csrfHeaders()});const data=r.ok?await r.json():[];rows.innerHTML=data.map(e=>`<tr><td>${e.occurredAt??''}</td><td>${e.username}</td><td>${e.action}</td><td>${e.httpMethod??''}</td><td>${e.requestPath??''}</td><td class="${e.responseStatus>=400?'error':'ok'}">${e.responseStatus}</td><td>${e.remoteAddress??''}</td><td>${e.durationMs??''}</td></tr>`).join('');}
loadSummary();loadAudit();setInterval(()=>{loadSummary();loadAudit();},30000);
</script>
</body></html>
