openapi: 3.0.3
info:
  title: ЭВО.СНТ Run API
  version: 1.1.0
  description: >-
    Версионированный API запуска S3-тестов, чтения текущих запусков, долговременной
    истории и повторного запуска безопасно сохранённой конфигурации S3, ClickHouse и Kafka тестов.
servers:
  - url: /api/v1
    description: Текущий Coordinator
tags:
  - name: Runs
    description: Текущий жизненный цикл запусков
  - name: Run history
    description: Долговременная история и повторный запуск
security:
  - bearerAuth: []
paths:
  /profiles/s3:
    get:
      tags: [Runs]
      operationId: listS3Profiles
      summary: Получить доступные S3-профили
      description: Возвращает только поля выбора профиля, без endpoint, bucket, Vault path и credentials.
      responses:
        '200':
          description: Безопасный список S3-профилей
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/S3ProfileSummary'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '500':
          $ref: '#/components/responses/InternalError'
  /runs/s3:
    post:
      tags: [Runs]
      operationId: startS3Run
      summary: Идемпотентно запустить локальный S3-тест
      description: >-
        Первый запрос создаёт запуск. Повтор с тем же Idempotency-Key, клиентом и телом
        возвращает исходный runId; изменённое тело возвращает IDEMPOTENCY_CONFLICT.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/S3RunRequest'
      responses:
        '202':
          description: Запуск принят либо воспроизведён по ключу
          headers:
            Location:
              description: Канонический URL состояния запуска
              schema:
                type: string
            Idempotency-Replayed:
              description: true, если возвращён ранее созданный запуск
              schema:
                type: boolean
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunAccepted'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/ProfileNotFound'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '429':
          $ref: '#/components/responses/CapacityExceeded'
        '500':
          $ref: '#/components/responses/InternalError'
  /runs:
    get:
      tags: [Runs]
      operationId: listRuns
      summary: Получить текущие запуски
      parameters:
        - $ref: '#/components/parameters/Scope'
        - $ref: '#/components/parameters/TestType'
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/Query'
        - name: limit
          in: query
          description: Максимальное число результатов
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 200
      responses:
        '200':
          description: Список запусков
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RunLifecycle'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '500':
          $ref: '#/components/responses/InternalError'
  /runs/{id}:
    get:
      tags: [Runs]
      operationId: getRun
      summary: Получить текущий запуск
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Текущий запуск
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunLifecycle'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/RunNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /run-history:
    get:
      tags: [Run history]
      operationId: listRunHistory
      summary: Получить долговременную историю
      parameters:
        - $ref: '#/components/parameters/Scope'
        - $ref: '#/components/parameters/TestType'
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/Query'
        - name: from
          in: query
          description: Начало интервала создания, включительно
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Конец интервала создания, исключительно
          schema:
            type: string
            format: date-time
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 20
      responses:
        '200':
          description: Страница истории
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunHistoryPage'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '500':
          $ref: '#/components/responses/InternalError'
  /run-history/{id}:
    get:
      tags: [Run history]
      operationId: getRunHistoryEntry
      summary: Получить запись истории
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Запись истории
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunHistoryEntry'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/RunHistoryNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /run-history/{id}/rerun:
    post:
      tags: [Run history]
      operationId: rerunFromHistory
      summary: Повторить завершённый запуск
      description: Требует роль OPERATOR или ADMIN и сохранённую безопасную конфигурацию запуска.
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '202':
          description: Новый запуск создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RerunResult'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/RunHistoryNotFound'
        '409':
          $ref: '#/components/responses/RunStateConflict'
        '429':
          $ref: '#/components/responses/CapacityExceeded'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Стабильный ключ команды в рамках аутентифицированного клиента
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
    RunId:
      name: id
      in: path
      required: true
      description: UUID запуска
      schema:
        type: string
        format: uuid
    Scope:
      name: scope
      in: query
      schema:
        $ref: '#/components/schemas/RunScope'
    TestType:
      name: testType
      in: query
      schema:
        $ref: '#/components/schemas/TestType'
    Status:
      name: status
      in: query
      schema:
        $ref: '#/components/schemas/RunStatus'
    Query:
      name: q
      in: query
      description: Поиск по ID, названию, операции, цели или сообщению
      schema:
        type: string
  responses:
    InvalidRequest:
      description: Некорректные параметры запроса
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            type: urn:evo-snt:error:invalid-request
            title: Bad Request
            status: 400
            code: INVALID_REQUEST
            detail: 'Unsupported scope: REMOTE'
            instance: /api/v1/runs
            requestId: 25b72370-0387-4935-b01b-20f8ccfb5fa9
            timestamp: '2026-11-11T09:00:00Z'
    AuthenticationRequired:
      description: Требуется аутентификация
      headers:
        WWW-Authenticate:
          description: Схема bearer-аутентификации
          schema:
            type: string
            example: Bearer
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiError'
    AccessDenied:
      description: Недостаточно прав
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiError'
    RunNotFound:
      description: Текущий запуск не найден
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiError'
    RunHistoryNotFound:
      description: Запись истории не найдена
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ProfileNotFound:
      description: S3-профиль не найден
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiError'
    IdempotencyConflict:
      description: Ключ уже использован с другим телом команды
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiError'
    RunStateConflict:
      description: Состояние запуска не допускает операцию
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiError'
    CapacityExceeded:
      description: Исчерпана доступная ёмкость выполнения
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          description: Рекомендуемая задержка перед повтором, секунд
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiError'
    InternalError:
      description: Внутренняя ошибка без раскрытия технических деталей
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiError'
  headers:
    RequestId:
      description: Идентификатор запроса для трассировки
      schema:
        type: string
        minLength: 1
        maxLength: 64
  schemas:
    S3ProfileSummary:
      type: object
      additionalProperties: false
      required: [id, name, defaultProfile]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        defaultProfile:
          type: boolean
    S3RunRequest:
      type: object
      additionalProperties: false
      required: [profileId]
      properties:
        profileId:
          type: string
          format: uuid
        objectKey:
          type: string
          default: performance-test/random-upload.bin
        objectSizeMiB:
          type: integer
          format: int64
          minimum: 1
          maximum: 1048576
          default: 32
        partSizeMiB:
          type: integer
          format: int64
          minimum: 5
          maximum: 5120
          default: 8
        parallelism:
          type: integer
          minimum: 1
          maximum: 32
          default: 4
        objectCount:
          type: integer
          minimum: 1
          maximum: 1000
          default: 1
        deleteAfterTest:
          type: boolean
          default: true
        operation:
          type: string
          enum: [UPLOAD, DOWNLOAD, HEAD, LIST, DELETE, LIFECYCLE, MIXED]
          default: UPLOAD
        executionMode:
          type: string
          enum: [OBJECT_COUNT, TIME_DURATION]
          default: OBJECT_COUNT
        durationSeconds:
          type: integer
          format: int64
          minimum: 1
          maximum: 604800
          default: 60
        warmupSeconds:
          type: integer
          format: int64
          minimum: 0
          maximum: 86400
          default: 0
        workloadProfile:
          type: string
          enum: [CUSTOM, INGESTION, ANALYTICS, ETL, BACKUP, ARCHIVE]
          default: CUSTOM
        workloadWeights:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
        targetOperationsPerSecond:
          type: integer
          minimum: 0
          maximum: 100000
          default: 0
        operationThreads:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
    RunAccepted:
      type: object
      additionalProperties: false
      required: [runId, testType, scope, monitorUrl, replayed]
      properties:
        runId:
          type: string
          format: uuid
        testType:
          type: string
          enum: [S3]
        scope:
          type: string
          enum: [LOCAL]
        monitorUrl:
          type: string
        replayed:
          type: boolean
    RunScope:
      type: string
      enum: [LOCAL, DISTRIBUTED]
    TestType:
      type: string
      enum: [S3, CLICKHOUSE, KAFKA]
    RunStatus:
      type: string
      enum: [ASSIGNED, QUEUED, RUNNING, COMPLETED, COMPLETED_WITH_ERRORS, FAILED, CANCELLED]
    RunStopReason:
      type: string
      enum: [NORMAL, TIMEOUT, USER_CANCELLED, DEADLINE_EXCEEDED, ERROR, AGENT_CANCELLED, RECOVERY_TIMEOUT, RECOVERY_FAILED, UNKNOWN]
    RunLifecycle:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - testType
        - scope
        - status
        - createdAt
        - completedOperations
        - rowsProcessed
        - bytesTransferred
        - operationsPerSecond
        - throughputMiBps
        - p50LatencyMs
        - p95LatencyMs
        - p99LatencyMs
        - errors
        - participants
        - latencyScope
        - detailsUrl
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        testType:
          $ref: '#/components/schemas/TestType'
        scope:
          $ref: '#/components/schemas/RunScope'
        status:
          $ref: '#/components/schemas/RunStatus'
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
          nullable: true
        finishedAt:
          type: string
          format: date-time
          nullable: true
        stopReason:
          allOf:
            - $ref: '#/components/schemas/RunStopReason'
          nullable: true
        message:
          type: string
          nullable: true
        completedOperations:
          type: integer
          format: int64
        rowsProcessed:
          type: integer
          format: int64
        bytesTransferred:
          type: integer
          format: int64
        operationsPerSecond:
          type: number
          format: double
        throughputMiBps:
          type: number
          format: double
        p50LatencyMs:
          type: number
          format: double
        p95LatencyMs:
          type: number
          format: double
        p99LatencyMs:
          type: number
          format: double
        errors:
          type: integer
          format: int64
        participants:
          type: integer
          format: int32
        latencyScope:
          type: string
        detailsUrl:
          type: string
    RunHistoryPage:
      type: object
      additionalProperties: false
      required: [items, page, size, totalElements, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RunHistoryEntry'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          minimum: 0
    RunHistoryEntry:
      type: object
      additionalProperties: false
      required:
        - id
        - testType
        - scope
        - status
        - createdAt
        - name
        - operation
        - target
        - initiator
        - completedOperations
        - rowsProcessed
        - bytesTransferred
        - operationsPerSecond
        - throughputMiBps
        - p50LatencyMs
        - p95LatencyMs
        - p99LatencyMs
        - errors
        - participants
        - latencyScope
        - rerunnable
      properties:
        id:
          type: string
          format: uuid
        testType:
          $ref: '#/components/schemas/TestType'
        scope:
          $ref: '#/components/schemas/RunScope'
        status:
          $ref: '#/components/schemas/RunStatus'
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
          nullable: true
        finishedAt:
          type: string
          format: date-time
          nullable: true
        name:
          type: string
        operation:
          type: string
        target:
          type: string
        initiator:
          type: string
        completedOperations:
          type: integer
          format: int64
        rowsProcessed:
          type: integer
          format: int64
        bytesTransferred:
          type: integer
          format: int64
        operationsPerSecond:
          type: number
          format: double
        throughputMiBps:
          type: number
          format: double
        p50LatencyMs:
          type: number
          format: double
        p95LatencyMs:
          type: number
          format: double
        p99LatencyMs:
          type: number
          format: double
        errors:
          type: integer
          format: int64
        stopReason:
          allOf:
            - $ref: '#/components/schemas/RunStopReason'
          nullable: true
        message:
          type: string
          nullable: true
        participants:
          type: integer
          format: int32
        latencyScope:
          type: string
        sourceDetailUrl:
          type: string
          nullable: true
        rerunnable:
          type: boolean
    RerunResult:
      type: object
      additionalProperties: false
      required: [sourceRunId, runId, testType, scope, status, monitorUrl]
      properties:
        sourceRunId:
          type: string
          format: uuid
        runId:
          type: string
          format: uuid
        testType:
          $ref: '#/components/schemas/TestType'
        scope:
          $ref: '#/components/schemas/RunScope'
        status:
          $ref: '#/components/schemas/RunStatus'
        monitorUrl:
          type: string
    ApiError:
      type: object
      additionalProperties: false
      required: [type, title, status, code, detail, instance, requestId, timestamp]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          format: int32
        code:
          type: string
          enum:
            - INVALID_REQUEST
            - AUTHENTICATION_REQUIRED
            - ACCESS_DENIED
            - RUN_NOT_FOUND
            - RUN_HISTORY_NOT_FOUND
            - RUN_STATE_CONFLICT
            - IDEMPOTENCY_CONFLICT
            - PROFILE_NOT_FOUND
            - CAPACITY_EXCEEDED
            - INTERNAL_ERROR
        detail:
          type: string
        instance:
          type: string
        requestId:
          type: string
          minLength: 1
          maxLength: 64
        timestamp:
          type: string
          format: date-time
