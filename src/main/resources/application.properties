management.endpoints.web.exposure.include=health,prometheus,metrics,info
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.metrics.tags.application=s3-performance-test
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.health.defaults.enabled=true
server.error.include-message=always

# Keycloak/OIDC security is opt-in to preserve bootstrap and existing deployments.
s3perf.security.enabled=${S3PERF_SECURITY_ENABLED:false}
s3perf.security.audit-enabled=${S3PERF_SECURITY_AUDIT_ENABLED:true}

# Example environment variables when security is enabled:
# SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_ISSUER_URI=https://keycloak.example/realms/s3-performance
# SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_CLIENT_ID=s3-performance-web
# SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_CLIENT_SECRET=change-me
# SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_SCOPE=openid,profile,email
# SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=https://keycloak.example/realms/s3-performance
