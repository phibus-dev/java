management.endpoints.web.exposure.include=health,prometheus,metrics,info
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.metrics.tags.application=s3-performance-test
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.health.defaults.enabled=true
server.error.include-message=on_param
server.error.include-stacktrace=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${S3PERF_SESSION_COOKIE_SECURE:false}
# Honor X-Forwarded-Proto/Host/Port from the HTTPS reverse proxy so OAuth2 redirect_uri
# is generated from the public HTTPS endpoint instead of the internal HTTP listener.
server.forward-headers-strategy=framework

# Flyway is started explicitly by BootstrapJdbcConfiguration only after PostgreSQL
# has been configured in the bootstrap store. Spring Boot auto-configuration must
# remain disabled so the first application start can expose /settings without a DB.
spring.flyway.enabled=false

# Bounded runtime and database resources. Override with environment variables
# (for example S3PERF_RUNTIME_MAX_CONCURRENT_RUNS) for larger agent nodes.
s3perf.runtime.max-concurrent-runs=${S3PERF_RUNTIME_MAX_CONCURRENT_RUNS:8}
s3perf.runtime.max-worker-tasks=${S3PERF_RUNTIME_MAX_WORKER_TASKS:64}
s3perf.runtime.max-run-duration-seconds=${S3PERF_RUNTIME_MAX_RUN_DURATION_SECONDS:86400}
s3perf.runtime.executor.core-size=${S3PERF_RUNTIME_EXECUTOR_CORE_SIZE:2}
s3perf.runtime.executor.max-size=${S3PERF_RUNTIME_EXECUTOR_MAX_SIZE:8}
s3perf.runtime.executor.queue-capacity=${S3PERF_RUNTIME_EXECUTOR_QUEUE_CAPACITY:32}
s3perf.postgresql.pool.maximum-size=${S3PERF_POSTGRESQL_POOL_MAXIMUM_SIZE:16}
s3perf.postgresql.pool.minimum-idle=${S3PERF_POSTGRESQL_POOL_MINIMUM_IDLE:1}
s3perf.postgresql.pool.connection-timeout-ms=${S3PERF_POSTGRESQL_CONNECTION_TIMEOUT_MS:10000}
s3perf.postgresql.pool.validation-timeout-ms=${S3PERF_POSTGRESQL_VALIDATION_TIMEOUT_MS:3000}
s3perf.postgresql.pool.idle-timeout-ms=${S3PERF_POSTGRESQL_IDLE_TIMEOUT_MS:600000}
s3perf.postgresql.pool.max-lifetime-ms=${S3PERF_POSTGRESQL_MAX_LIFETIME_MS:1800000}
s3perf.postgresql.pool.leak-detection-ms=${S3PERF_POSTGRESQL_LEAK_DETECTION_MS:0}
s3perf.postgresql.query-timeout-seconds=${S3PERF_POSTGRESQL_QUERY_TIMEOUT_SECONDS:30}
s3perf.postgresql.transaction-timeout-seconds=${S3PERF_POSTGRESQL_TRANSACTION_TIMEOUT_SECONDS:60}
s3perf.distributed.recovery-timeout-seconds=${S3PERF_DISTRIBUTED_RECOVERY_TIMEOUT_SECONDS:300}
s3perf.distributed.recovery-scan-initial-delay-ms=${S3PERF_DISTRIBUTED_RECOVERY_SCAN_INITIAL_DELAY_MS:30000}
s3perf.distributed.recovery-scan-interval-ms=${S3PERF_DISTRIBUTED_RECOVERY_SCAN_INTERVAL_MS:30000}

# Keycloak/OIDC security is opt-in to preserve bootstrap and existing deployments.
s3perf.security.enabled=${S3PERF_SECURITY_ENABLED:false}
s3perf.security.audit-enabled=${S3PERF_SECURITY_AUDIT_ENABLED:true}

# Set S3PERF_SESSION_COOKIE_SECURE=true when the application is published over HTTPS.
# Example environment variables when security is enabled:
# SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_ISSUER_URI=https://keycloak.example/realms/s3-performance
# SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_CLIENT_ID=s3-performance-web
# SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_CLIENT_SECRET=change-me
# SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_SCOPE=openid,profile,email
# SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=https://keycloak.example/realms/s3-performance
