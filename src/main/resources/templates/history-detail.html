<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Детали запуска</title><link rel="stylesheet" href="/app.css"></head>
<body><main class="container"><header><div><h1>Детали запуска</h1><p th:text="${detail.run.id}"></p></div><nav><a href="/history">← История</a> · <a href="/baselines">Baseline</a></nav></header>
<section class="panel"><div class="metrics"><article><span>Операция</span><strong th:text="${detail.run.operation}"></strong></article><article><span>Статус</span><strong th:text="${detail.run.status}"></strong></article><article><span>Средняя скорость</span><strong th:text="${#numbers.formatDecimal(detail.run.averageSpeedMiBps,1,2)+' MiB/s'}"></strong></article><article><span>p50 / p95 / p99</span><strong th:text="${detail.run.p50LatencyMs+' / '+detail.run.p95LatencyMs+' / '+detail.run.p99LatencyMs+' ms'}"></strong></article><article><span>Передано</span><strong th:text="${#numbers.formatDecimal(detail.run.bytesTransferred/1048576.0,1,1)+' MiB'}"></strong></article><article><span>Ошибки</span><strong th:text="${detail.run.failedParts}"></strong></article></div>
<p><b>Endpoint:</b> <span th:text="${detail.run.endpoint}"></span></p><p><b>Bucket:</b> <span th:text="${detail.run.bucket}"></span></p><p><b>Object key:</b> <span th:text="${detail.run.objectKey}"></span></p><p><b>Параметры:</b> <span th:text="${detail.run.objectSizeMiB+' MiB, part '+detail.run.partSizeMiB+' MiB, parallelism '+detail.run.parallelism+', objects '+detail.run.objectCount}"></span></p>
<div class="actions"><button type="button" th:onclick="|rerun('${detail.run.id}')|">Повторить тест</button><a class="button secondary" th:href="@{/api/history/{id}/regression(id=${detail.run.id})}">Сравнить с baseline</a></div><p id="result" class="muted"></p></section>
<section class="panel"><h2>Операции / части</h2><div class="table-wrap"><table><thead><tr><th>Объект</th><th>Часть</th><th>Байты</th><th>Длительность</th><th>Скорость</th><th>Статус</th><th>Ошибка</th></tr></thead><tbody><tr th:each="part : ${detail.parts}"><td th:text="${part.objectNumber}"></td><td th:text="${part.partNumber}"></td><td th:text="${part.bytes}"></td><td th:text="${part.durationMillis+' ms'}"></td><td th:text="${#numbers.formatDecimal(part.speedMiBps,1,2)+' MiB/s'}"></td><td th:text="${part.status}"></td><td th:text="${part.error}"></td></tr></tbody></table></div></section></main>
<script>async function rerun(id){const r=await fetch('/api/history/'+id+'/rerun',{method:'POST'});document.getElementById('result').textContent=r.ok?'Новый тест создан: '+(await r.json()).id:'Ошибка повторного запуска: '+await r.text();}</script></body></html>
