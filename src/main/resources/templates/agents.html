<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Агенты</title><link rel="stylesheet" href="/app.css"></head><body><main class="container"><header><div><h1>Агенты нагрузки</h1><p>Состояние зарегистрированных исполнителей распределённых тестов.</p></div><nav><a href="/">Тестирование</a> · <a href="/distributed-tests">Распределённые тесты</a></nav></header><section class="panel"><div class="title-row"><h2>Зарегистрированные агенты</h2><button id="refresh" class="secondary">Обновить</button></div><div class="table-wrap"><table><thead><tr><th>Имя</th><th>Hostname / адрес</th><th>Версия</th><th>CPU</th><th>Память</th><th>Статус</th><th>Последняя активность</th></tr></thead><tbody id="agents"><tr><td colspan="7">Загрузка…</td></tr></tbody></table></div></section></main><script>const body=document.getElementById('agents');async function load(){try{const r=await fetch('/api/agents');if(!r.ok)throw new Error(await r.text());const a=await r.json();body.innerHTML=a.length?a.map(x=>`<tr><td>${e(x.name)}</td><td>${e(x.hostname)}<br><small>${e(x.address)}</small></td><td>${e(x.version||'—')}</td><td>${x.cpuCount}</td><td>${(x.memoryBytes/1073741824).toFixed(1)} GiB</td><td><strong>${x.status}</strong></td><td>${new Date(x.lastSeenAt).toLocaleString()}</td></tr>`).join(''):'<tr><td colspan="7">Агенты не зарегистрированы</td></tr>';}catch(err){body.innerHTML=`<tr><td colspan="7">${e(err.message)}</td></tr>`;}}function e(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}document.getElementById('refresh').onclick=load;load();setInterval(load,10000);</script></body></html>
