<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title>Агенты — ЭВО.СНТ</title>
    <link rel="stylesheet" href="/app.css">
</head>
<body>
<main class="container">
    <header>
        <div>
            <h1>Агенты нагрузки</h1>
            <p>Регистрация, состояние, блокировка identity и управление обновлением исполнителей.</p>
        </div>
        <nav>
            <a href="/tasks">Задания</a> ·
            <a href="/distributed-tests">Распределённые тесты</a> ·
            <a href="/settings">Настройки</a>
        </nav>
    </header>

    <section class="panel">
        <div class="title-row">
            <h2>Зарегистрированные агенты</h2>
            <button id="refresh" type="button" class="secondary">Обновить</button>
        </div>
        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th>Имя</th>
                    <th>Hostname / адрес</th>
                    <th>Версия</th>
                    <th>Ресурсы</th>
                    <th>Статус</th>
                    <th>Обновление</th>
                    <th>Последняя активность</th>
                    <th>Управление</th>
                </tr>
                </thead>
                <tbody id="agents" aria-live="polite">
                <tr><td colspan="8">Получение списка агентов…</td></tr>
                </tbody>
            </table>
        </div>
        <pre id="result" aria-live="polite"></pre>
    </section>
</main>
<script src="/csrf-fetch.js"></script>
<script src="/agents.js"></script>
</body>
</html>
