<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="_csrf" th:content="${_csrf.token}">
  <meta name="_csrf_header" th:content="${_csrf.headerName}">
  <title>Профили S3 — ЭВО.СНТ</title>
  <th:block th:replace="~{fragments/layout :: headAssets}"></th:block>
</head>
<body>
<main class="container">
  <header th:replace="~{fragments/layout :: header(title='Профили подключений S3', subtitle='Подключения к S3-совместимым хранилищам и ссылки на секреты в Vault.')}"></header>
  <nav th:replace="~{fragments/layout :: primaryNav(active='s3')}"></nav>
  <nav th:replace="~{fragments/layout :: s3Nav(active='profiles')}"></nav>

  <section class="panel">
    <div class="section-heading"><div><h2>Новый профиль</h2><p class="muted">Секретные ключи не сохраняются в PostgreSQL. Профиль содержит параметры подключения и путь к секрету в Vault.</p></div><a href="/settings">← К настройкам</a></div>
    <div class="grid two">
      <label>Имя профиля<input id="name" placeholder="Например, minio-prod" required></label>
      <label>Endpoint<input id="endpoint" placeholder="https://s3.example.org" required></label>
      <label>Регион<input id="region" value="us-east-1" placeholder="Регион"></label>
      <label>Бакет<input id="bucket" placeholder="Бакет"></label>
      <label>Источник credentials<select id="credentialsSource"><option>VAULT</option><option>ENVIRONMENT</option><option>MANUAL</option></select></label>
      <label>Vault path<input id="vaultSecretPath" placeholder="secret/data/s3/profile"></label>
      <label>CA certificate<input id="caCertificatePath" placeholder="Путь к CA certificate"></label>
      <div class="form-options"><label class="check"><input id="pathStyleAccess" type="checkbox" checked> Path-style access</label><label class="check"><input id="defaultProfile" type="checkbox"> Профиль по умолчанию</label></div>
    </div>
    <div class="actions"><button type="button" id="create-profile" data-min-role="ADMIN">Создать профиль</button></div>
    <div id="message" class="diagnostic-output" aria-live="polite"></div>
  </section>

  <section class="panel">
    <div class="section-heading"><div><h2>Сохранённые профили</h2><p class="muted">Назначение профиля по умолчанию, клонирование и удаление.</p></div><button type="button" class="secondary" id="reload-profiles">Обновить</button></div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Имя</th><th>Endpoint</th><th>Регион</th><th>Бакет</th><th>Credentials</th><th>Vault path</th><th>Действия</th></tr></thead>
        <tbody id="profiles"><tr><td colspan="7" class="muted">Загрузка…</td></tr></tbody>
      </table>
    </div>
  </section>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</main>
<th:block th:replace="~{fragments/layout :: commonScripts}"></th:block>
<script src="/s3-profiles.js"></script>
</body>
</html>
