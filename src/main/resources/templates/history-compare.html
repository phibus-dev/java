<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Сравнение запусков S3 — ЭВО.СНТ</title>
  <th:block th:replace="~{fragments/layout :: headAssets}"></th:block>
</head>
<body><main class="container">
<header th:replace="~{fragments/layout :: header(title='Сравнение запусков S3', subtitle='Сопоставление сохранённых результатов тестирования.')}"></header>
<nav th:replace="~{fragments/layout :: primaryNav(active='s3')}"></nav>
<nav th:replace="~{fragments/layout :: s3Nav(active='history')}"></nav>
<section class="panel">
  <p class="warning" th:if="${!comparison.latencyComparable}"
     th:text="${'Перцентили имеют разные scope (' + comparison.left.latencyScope + ' и ' + comparison.right.latencyScope + ') и напрямую несопоставимы.'}"></p>
  <div class="delta-grid">
    <article><span>Throughput</span><strong th:text="${#numbers.formatDecimal(comparison.speedChangePercent,1,1) + '%'}"></strong></article>
    <article><span>p95</span><strong th:text="${#numbers.formatDecimal(comparison.p95ChangePercent,1,1) + '%'}"></strong></article>
    <article><span>p99</span><strong th:text="${#numbers.formatDecimal(comparison.p99ChangePercent,1,1) + '%'}"></strong></article>
    <article><span>Разница ошибок</span><strong th:text="${comparison.errorDifference}"></strong></article>
    <article><span>Длительность</span><strong th:text="${#numbers.formatDecimal(comparison.durationChangePercent,1,1) + '%'}"></strong></article>
  </div>
</section>
<section class="compare-grid">
  <article class="panel"><h2>Левый запуск</h2>
    <p><b>ID:</b> <a th:href="@{/history/{id}(id=${comparison.left.id})}" th:text="${comparison.left.id}"></a></p>
    <p><b>Создан:</b> <span th:text="${comparison.left.createdAt}"></span></p>
    <p><b>Операция:</b> <span th:text="${comparison.left.operation}"></span></p>
    <p><b>Статус:</b> <span th:text="${comparison.left.status}"></span></p>
    <p><b>Endpoint / Bucket:</b> <span th:text="${comparison.left.endpoint + ' / ' + comparison.left.bucket}"></span></p>
    <p><b>Throughput:</b> <span th:text="${#numbers.formatDecimal(comparison.left.averageSpeedMiBps,1,2) + ' MiB/s'}"></span></p>
    <p><b>p50 / p95 / p99:</b> <span th:text="${comparison.left.p50LatencyMs + ' / ' + comparison.left.p95LatencyMs + ' / ' + comparison.left.p99LatencyMs + ' ms (' + comparison.left.latencyScope + ')'}"></span></p>
    <p><b>Ошибки:</b> <span th:text="${comparison.left.failedParts}"></span></p>
  </article>
  <article class="panel"><h2>Правый запуск</h2>
    <p><b>ID:</b> <a th:href="@{/history/{id}(id=${comparison.right.id})}" th:text="${comparison.right.id}"></a></p>
    <p><b>Создан:</b> <span th:text="${comparison.right.createdAt}"></span></p>
    <p><b>Операция:</b> <span th:text="${comparison.right.operation}"></span></p>
    <p><b>Статус:</b> <span th:text="${comparison.right.status}"></span></p>
    <p><b>Endpoint / Bucket:</b> <span th:text="${comparison.right.endpoint + ' / ' + comparison.right.bucket}"></span></p>
    <p><b>Throughput:</b> <span th:text="${#numbers.formatDecimal(comparison.right.averageSpeedMiBps,1,2) + ' MiB/s'}"></span></p>
    <p><b>p50 / p95 / p99:</b> <span th:text="${comparison.right.p50LatencyMs + ' / ' + comparison.right.p95LatencyMs + ' / ' + comparison.right.p99LatencyMs + ' ms (' + comparison.right.latencyScope + ')'}"></span></p>
    <p><b>Ошибки:</b> <span th:text="${comparison.right.failedParts}"></span></p>
  </article>
</section>
<footer th:replace="~{fragments/layout :: footer}"></footer></main><th:block th:replace="~{fragments/layout :: commonScripts}"></th:block></body></html>
