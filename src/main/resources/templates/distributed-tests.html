<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title>Распределённые тесты — ЭВО.СНТ</title>
    <link rel="stylesheet" href="/app.css">
</head>
<body>
<main class="container">
    <header>
        <div>
            <h1>Распределённые тесты</h1>
            <p>Запуск заданий на выбранных агентах и агрегирование промежуточной статистики.</p>
        </div>
        <nav><a href="/tasks">Тестирование</a> · <a href="/agents">Агенты</a></nav>
    </header>

    <section class="panel">
        <h2>Новый запуск</h2>
        <label>Название<input id="name" value="Distributed S3 test"></label>
        <h3>Агенты</h3>
        <div id="agent-list" class="grid two" aria-live="polite">Получение списка агентов…</div>
        <label>Параметры TestRequest, JSON<textarea id="request" rows="16">{
  "endpoint":"http://localhost:9000",
  "bucket":"test",
  "region":"us-east-1",
  "accessKey":null,
  "secretKey":null,
  "pathStyleAccess":true,
  "objectKey":"distributed-test/object.bin",
  "objectSizeMiB":64,
  "partSizeMiB":16,
  "parallelism":4,
  "objectCount":1,
  "deleteAfterTest":true,
  "operation":"UPLOAD",
  "executionMode":"TIME_DURATION",
  "durationSeconds":60,
  "warmupSeconds":5,
  "workloadProfile":"CUSTOM",
  "workloadWeights":{},
  "targetOperationsPerSecond":0,
  "operationThreads":{}
}</textarea></label>
        <div class="actions">
            <button id="start" type="button">Запустить</button>
            <span id="message" class="muted" aria-live="polite"></span>
        </div>
    </section>

    <section class="panel">
        <div class="title-row">
            <h2>История распределённых запусков</h2>
            <button id="refresh" type="button" class="secondary">Обновить</button>
        </div>
        <div id="runs" aria-live="polite">Получение истории распределённых запусков…</div>
    </section>
</main>
<script src="/csrf-fetch.js"></script>
<script src="/distributed-tests.js"></script>
</body>
</html>
