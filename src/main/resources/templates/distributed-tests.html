<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title>Распределённые тесты — ЭВО.СНТ</title>
    <th:block th:replace="~{fragments/layout :: headAssets}"></th:block>
</head>
<body>
<main class="container">
    <header th:replace="~{fragments/layout :: header(title='Распределённые тесты', subtitle='Запуск S3 и ClickHouse заданий на выбранных агентах.')}"></header>
    <nav th:replace="~{fragments/layout :: primaryNav(active='distributed')}"></nav>

    <section class="panel">
        <h2>Новый запуск</h2>
        <div class="grid two">
            <label>Движок<select id="engine"><option value="S3">S3</option><option value="CLICKHOUSE">ClickHouse</option></select></label>
            <label>Название<input id="name" value="Distributed S3 test"></label>
        </div>
        <p id="engine-help" class="muted">Будут показаны агенты с capability S3.</p>
        <h3>Агенты</h3>
        <div id="agent-list" class="grid two" aria-live="polite">Получение списка агентов…</div>
        <label>Параметры задания, JSON<textarea id="request" rows="18"></textarea></label>
        <label id="endpoint-map-field" hidden>Endpoint по Agent ID, JSON<textarea id="endpoint-map" rows="5">{}</textarea><small class="muted">Необязательно. Позволяет направить каждый агент на отдельную ClickHouse-ноду.</small></label>
        <div class="actions"><button id="start" type="button" data-min-role="OPERATOR">Запустить</button><span id="message" class="muted" aria-live="polite"></span></div>
    </section>

    <section class="panel">
        <div class="title-row"><div><h2>Текущие распределённые запуски</h2><p class="muted">Включает S3 и ClickHouse. ClickHouse дополнительно показывает rows/s.</p></div><button id="refresh" type="button" class="secondary">Обновить</button></div>
        <div id="runs" aria-live="polite">Получение распределённых запусков…</div>
    </section>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</main>
<th:block th:replace="~{fragments/layout :: commonScripts}"></th:block>
<script src="/csrf-fetch.js"></script>
<script src="/distributed-tests.js"></script>
</body>
</html>
