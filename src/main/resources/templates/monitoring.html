<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Мониторинг — ЭВО.СНТ</title><th:block th:replace="~{fragments/layout :: headAssets}"></th:block></head>
<body><main class="container"><header th:replace="~{fragments/layout :: header(title='Мониторинг', subtitle='Контроль готовности приложения и инфраструктурных подключений.')}"></header>
<nav th:replace="~{fragments/layout :: primaryNav(active='monitoring')}"></nav>
<section class="panel"><div class="title-row"><div><h2>Health Dashboard</h2><p class="muted">Автоматическое обновление каждые 30 секунд. Статус READY означает корректность базовой конфигурации; фактическое подключение проверяется в разделе «Настройки».</p></div><button id="refresh-health" class="secondary" type="button">Обновить</button></div><div class="metrics"><article><span>Состояние приложения</span><strong id="application-state">Загрузка…</strong></article><article><span>Последняя проверка</span><strong id="checked-at">—</strong></article><article><span>Uptime</span><strong id="uptime">—</strong></article></div><p id="health-error" class="warning" hidden></p></section>
<section class="health-grid" id="health-components" aria-live="polite"><article class="panel"><h2>Получение состояния…</h2></article></section>
<footer th:replace="~{fragments/layout :: footer}"></footer></main><th:block th:replace="~{fragments/layout :: commonScripts}"></th:block><script src="/monitoring.js"></script></body></html>
