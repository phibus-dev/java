<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Репликация ClickHouse — ЭВО.СНТ</title>
  <th:block th:replace="~{fragments/layout :: headAssets}"></th:block>
</head>
<body><main class="container">
<header th:replace="~{fragments/layout :: header(title='Репликация ClickHouse', subtitle='Состояние Replicated-таблиц и фоновых процессов.')}"></header>
<nav th:replace="~{fragments/layout :: primaryNav(active='clickhouse')}"></nav>
<nav th:replace="~{fragments/layout :: clickHouseNav(active='replication')}"></nav>
<section class="panel">
  <div class="title-row">
    <div><h2>Снимок состояния</h2><p class="muted">system.replicas, replication_queue, parts, merges и mutations.</p></div>
    <div class="actions">
      <select id="profile" aria-label="Профиль ClickHouse"><option value="">Профиль</option><option th:each="p:${profiles}" th:value="${p.id}" th:text="${p.name}"></option></select>
      <button id="refresh" type="button">Обновить</button>
    </div>
  </div>
  <div id="summary" class="system-grid" aria-live="polite"></div>
</section>
<section id="nodes" aria-live="polite"></section>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</main>
<th:block th:replace="~{fragments/layout :: commonScripts}"></th:block>
<script src="/clickhouse-replication.js"></script>
</body></html>
