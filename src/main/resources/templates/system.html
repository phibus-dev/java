<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Состояние системы — ЭВО.СНТ</title>
  <th:block th:replace="~{fragments/layout :: headAssets}"></th:block>
</head>
<body><main class="container">
  <header th:replace="~{fragments/layout :: header(title='Состояние системы', subtitle='Проверка выполняется при каждом открытии страницы.')}"></header>
  <nav th:replace="~{fragments/layout :: primaryNav(active='settings')}"></nav>
  <nav th:replace="~{fragments/layout :: settingsNav(active='system')}"></nav>
  <section class="grid">
    <article class="card" th:with="item=${report.postgresql}"><h2>PostgreSQL</h2><h3 th:class="${item.success} ? 'ok' : 'fail'" th:text="${item.success} ? 'Доступен' : 'Недоступен'"></h3><p th:text="${item.message}"></p><div class="row"><span>Задержка</span><span th:text="${item.latencyMs + ' ms'}"></span></div><div class="row" th:each="entry:${item.details}"><span th:text="${entry.key}"></span><span th:text="${entry.value}"></span></div></article>
    <article class="card" th:with="item=${report.vault}"><h2>Vault</h2><h3 th:class="${item.success} ? 'ok' : 'fail'" th:text="${item.success} ? 'Доступен' : 'Недоступен'"></h3><p th:text="${item.message}"></p><div class="row"><span>Задержка</span><span th:text="${item.latencyMs + ' ms'}"></span></div><div class="row" th:each="entry:${item.details}"><span th:text="${entry.key}"></span><span th:text="${entry.value}"></span></div></article>
    <article class="card" th:with="item=${report.s3}"><h2>S3</h2><h3 th:class="${item.success} ? 'ok' : 'fail'" th:text="${item.success} ? 'Доступен' : 'Недоступен'"></h3><p th:text="${item.message}"></p><div class="row"><span>Задержка</span><span th:text="${item.latencyMs + ' ms'}"></span></div><div class="row" th:each="entry:${item.details}"><span th:text="${entry.key}"></span><span th:text="${entry.value}"></span></div></article>
    <article class="card"><h2>Приложение</h2><h3 class="ok">Работает</h3><div class="row" th:each="entry:${report.application}"><span th:text="${entry.key}"></span><span th:text="${entry.value}"></span></div></article>
  </section>
  <div class="actions"><a class="button" href="/system">Повторить проверку</a></div>
  <footer th:replace="~{fragments/layout :: footer}"></footer>
</main><th:block th:replace="~{fragments/layout :: commonScripts}"></th:block></body></html>
