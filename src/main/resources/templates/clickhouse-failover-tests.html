<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="_csrf" th:content="${_csrf.token}"><meta name="_csrf_header" th:content="${_csrf.headerName}"><title>Failover ClickHouse — ЭВО.СНТ</title><th:block th:replace="~{fragments/layout :: headAssets}"></th:block></head>
<body><main class="container"><header th:replace="~{fragments/layout :: header(title='Failover ClickHouse', subtitle='Контролируемый отказ и возврат реплики с непрерывной нагрузкой.')}"></header>
<nav th:replace="~{fragments/layout :: primaryNav(active='clickhouse')}"></nav>
<nav th:replace="~{fragments/layout :: clickHouseNav(active='failover')}"></nav>
<section class="panel"><h2>Подготовка ReplicatedMergeTree</h2><form id="provision-form"><div class="grid two"><label>Профиль<select id="provisionProfile" required><option value="">Выберите профиль</option><option th:each="p:${profiles}" th:value="${p.id}" th:text="${p.name}"></option></select></label><label>Таблица<input id="provisionTable" value="evo_snt_perf_replica" required></label><label>Keeper path (поддерживает {shard} и {replica})<input id="keeperPath" value="/clickhouse/tables/{shard}/evo_snt_perf_replica" placeholder="/clickhouse/tables/{shard}/table_name" required></label><label>Replica macro<input id="replicaMacro" value="{replica}" required></label><label class="check"><input id="dropExisting" type="checkbox"> DROP существующей таблицы перед созданием</label></div><div class="actions"><button type="submit" data-min-role="OPERATOR">Создать на всех endpoints</button><span id="provision-message" role="status" aria-live="polite"></span></div></form></section>
<section class="panel"><h2>Failover scenario</h2><form id="failover-form"><div class="grid two"><label>Профиль<select id="profileId" required><option value="">Выберите профиль</option><option th:each="p:${profiles}" th:value="${p.id}" th:text="${p.name}"></option></select></label><label>Таблица<input id="table" value="evo_snt_perf_replica" required></label><label>Source endpoint<input id="sourceEndpoint" placeholder="Пусто = первый endpoint"></label><label>Batch size<input id="batchSize" type="number" min="1" value="1000"></label><label>Payload bytes<input id="payloadBytes" type="number" min="1" value="128"></label><label>Baseline, sec<input id="baselineSeconds" type="number" min="1" value="10"></label><label>Fault confirmation timeout, sec<input id="faultConfirmationTimeoutSeconds" type="number" min="1" value="300"></label><label>Fault observation, sec<input id="faultObservationSeconds" type="number" min="1" value="15"></label><label>Recovery confirmation timeout, sec<input id="recoveryConfirmationTimeoutSeconds" type="number" min="1" value="300"></label><label>Recovery timeout, sec<input id="recoveryTimeoutSeconds" type="number" min="1" value="300"></label><label>Poll interval, ms<input id="pollIntervalMs" type="number" min="200" value="1000"></label></div><div class="actions"><button type="submit" data-min-role="OPERATOR">Запустить</button><span id="message" role="status" aria-live="polite"></span></div></form></section>
<section class="panel" id="active" hidden><div class="title-row"><h2>Текущий failover test</h2><div class="actions"><button id="fault-applied" type="button" data-min-role="OPERATOR" class="secondary" disabled>Отказ применён</button><button id="recovery-started" type="button" data-min-role="OPERATOR" class="secondary" disabled>Реплика возвращена</button></div></div><div class="system-grid"><div><span>Статус</span><strong id="status">—</strong></div><div><span>Rows written</span><strong id="rows">—</strong></div><div><span>Failed ops</span><strong id="errors">—</strong></div><div><span>Service interruption</span><strong id="interruption">—</strong></div><div><span>Recovery</span><strong id="recovery">—</strong></div><div><span>Max delay</span><strong id="delay">—</strong></div><div><span>Max queue</span><strong id="queue">—</strong></div><div><span>Max log lag</span><strong id="lag">—</strong></div><div><span>Consistency</span><strong id="consistency">—</strong></div></div><p id="detail" class="muted"></p></section>
<section class="panel"><h2>История failover</h2><div class="table-wrap"><table><thead><tr><th>Дата</th><th>Таблица</th><th>Статус</th><th>Rows</th><th>Errors</th><th>Interruption ms</th><th>Recovery ms</th><th>Delay</th><th>Queue</th><th>Consistency</th></tr></thead><tbody data-history-page><tr th:each="r:${history}"><td th:text="${r.createdAt}"></td><td th:text="${r.table}"></td><td th:text="${r.status}"></td><td th:text="${r.rowsWritten}"></td><td th:text="${r.failedOperations}"></td><td th:text="${r.serviceInterruptionMs}"></td><td th:text="${r.recoveryTimeMs}"></td><td th:text="${r.maxReplicationDelaySeconds}"></td><td th:text="${r.maxReplicationQueue}"></td><td th:text="${r.consistencyPassed}"></td></tr></tbody></table></div></section>
<footer th:replace="~{fragments/layout :: footer}"></footer></main><th:block th:replace="~{fragments/layout :: commonScripts}"></th:block><script src="/clickhouse-failover-tests.js"></script></body></html>
