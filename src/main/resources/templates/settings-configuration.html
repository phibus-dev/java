<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="_csrf" th:content="${_csrf.token}">
  <meta name="_csrf_header" th:content="${_csrf.headerName}">
  <title>Импорт и экспорт конфигурации — ЭВО.СНТ</title>
  <th:block th:replace="~{fragments/layout :: headAssets}"></th:block>
</head>
<body><main class="container">
<header th:replace="~{fragments/layout :: header(title='Импорт / экспорт конфигурации', subtitle='Перенос настроек ЭВО.СНТ между стендами.')}"></header>
<nav th:replace="~{fragments/layout :: primaryNav(active='settings')}"></nav>
<nav th:replace="~{fragments/layout :: settingsNav(active='configuration')}"></nav>
<section class="transfer-grid">
  <article class="panel"><h2>Экспорт</h2>
    <label class="check"><input id="encrypted" type="checkbox" checked> Зашифровать экспорт</label>
    <label class="check"><input id="secrets" type="checkbox"> Включить секреты</label>
    <label>Пароль шифрования<input id="exportPassword" type="password" minlength="12" autocomplete="new-password"></label>
    <p class="muted">Для экспорта секретов шифрование обязательно. Используется AES-256-GCM и PBKDF2-HMAC-SHA256.</p>
    <button id="export-config" type="button" data-min-role="ADMIN">Экспортировать</button>
  </article>
  <article class="panel"><h2>Импорт</h2>
    <div class="drop"><input id="file" type="file" accept=".json,.evos3,application/json,application/octet-stream"><p>Выберите JSON или зашифрованный файл .evos3</p></div>
    <label>Пароль для .evos3<input id="importPassword" type="password" autocomplete="current-password"></label>
    <div class="actions"><button id="validate-config" type="button" class="secondary" data-min-role="ADMIN">Проверить</button><button id="import-config" type="button" data-min-role="ADMIN">Импортировать</button></div>
    <p class="warning">Перед импортом автоматически создаётся резервная копия bootstrap-файла. Для применения PostgreSQL и Keycloak потребуется перезапуск.</p>
    <pre id="status" class="diagnostic-output" role="status" aria-live="polite"></pre>
  </article>
</section>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</main>
<th:block th:replace="~{fragments/layout :: commonScripts}"></th:block>
<script src="/csrf-fetch.js"></script>
<script src="/settings-configuration.js"></script>
</body></html>
