<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ошибка — ЭВО.СНТ</title><th:block th:replace="~{fragments/layout :: headAssets}"></th:block></head>
<body><main class="container"><header th:replace="~{fragments/layout :: header(title='Ошибка', subtitle='Не удалось открыть запрошенный раздел.')}"></header><nav th:replace="~{fragments/layout :: primaryNav(active='')}"></nav>
<section class="panel"><h2 th:text="${status != null ? 'HTTP ' + status : 'Ошибка приложения'}">Ошибка приложения</h2><p th:text="${message != null && !message.isBlank() ? message : 'Запрошенный ресурс не найден или временно недоступен.'}"></p><p class="muted" th:if="${path != null}">Путь: <code th:text="${path}"></code></p><div class="actions"><a class="button" href="/">Вернуться на главную</a></div></section><footer th:replace="~{fragments/layout :: footer}"></footer></main><th:block th:replace="~{fragments/layout :: commonScripts}"></th:block></body></html>
